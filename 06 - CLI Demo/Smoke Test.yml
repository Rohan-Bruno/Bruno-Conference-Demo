info:
  name: Smoke Test
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  scripts:
    - type: tests
      code: |-
        test("service is healthy", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().status).to.equal("ok");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Run from terminal inside the collection folder:
    bru run --env Dev
    bru run "03 - Tests" --env Staging
    bru run --env Dev --reporter-html results.html
  Talking point: the same files run in CI (GitHub Actions) with no export step.
