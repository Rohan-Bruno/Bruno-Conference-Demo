info:
  name: Get Profile (Bearer)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/me"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("authorized with token from Login", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.getBody().username).to.equal("demo");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
